# Kind NetworkACL: contracts use `kind: NetworkACL`.
# Inputs list what a contract may set (with kind defaults); enforced is the locked security baseline.
kind: NetworkACL
id: aws-network-acl
title: AWS network ACL
description: One network ACL in a VPC (first-party module); its rules and subnet associations stay as they are.
source: first-party/aws/network-acl
versions:
  - 1.0.0
providers:
  - hashicorp/aws
inputs:
  - name: name
    type: string
    description: Name tag.
    pattern: ^[a-zA-Z0-9 ._-]{1,255}$
  - name: vpc_id
    type: string
    required: true
    description: Usually a reference to a VPC output.
  - name: tags
    type: map(string)
    description: Tags.
outputs:
  - id
  - arn
adopt:
  resource: aws_network_acl
  match:
    aws: ["ec2:network-acl"]
  properties:
    aws: {type: "AWS::EC2::NetworkAcl", id: "{{id_tail}}"}
  inputs:
    name: "{{propfind:Tags:Key=Name:Value}}"
    vpc_id: "{{prop:VpcId}}"
    tags: "{{tags}}"
  dependencies:
    - {path: VpcId, kind: VPC, output: vpc_id, input: vpc_id}
  imports:
    - {to: "aws_network_acl.this", id: "{{id_tail}}"}
