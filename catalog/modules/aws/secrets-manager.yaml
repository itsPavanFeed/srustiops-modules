# Kind SecretsManagerSecret: contracts use `kind: SecretsManagerSecret`.
# Inputs list what a contract may set (with kind defaults); enforced is the locked security baseline.
kind: SecretsManagerSecret
id: aws-secrets-manager
title: AWS Secrets Manager secret
description: Secrets Manager secret container; its value is set outside the contract (never in code).
source: terraform-aws-modules/secrets-manager/aws
versions:
  - 2.2.0
providers:
  - hashicorp/aws
inputs:
  - name: name
    type: string
    required: true
    description: Secret name.
    pattern: ^[a-zA-Z0-9/_+=.@-]{1,512}$
  - name: description
    type: string
  - name: kms_key_id
    type: string
    description: KMS key, usually a reference to a KMSKey output.
  - name: recovery_window_in_days
    type: number
    default: 30
    min: 0
    max: 30
  - name: tags
    type: map(string)
    description: Tags.
enforced:
  create_secret_version: false
  block_public_policy: true
outputs:
  - secret_arn
  - secret_id
  - secret_name
adopt:
  resource: aws_secretsmanager_secret
  match:
    aws: ["secretsmanager:secret"]
  properties:
    aws: {type: "AWS::SecretsManager::Secret", id: "{{id}}"}
  inputs:
    name: "{{prop:Name}}"
    description: "{{prop:Description}}"
    kms_key_id: "{{prop:KmsKeyId}}"
    tags: "{{tags}}"
  dependencies:
    - {path: KmsKeyId, kind: KMSKey, output: key_arn, input: kms_key_id}
  imports:
    - {to: "aws_secretsmanager_secret.this[0]", id: "{{id}}"}
