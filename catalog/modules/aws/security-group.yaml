# Kind SecurityGroup: contracts use `kind: SecurityGroup`.
# Inputs list what a contract may set (with kind defaults); enforced is the locked security baseline.
kind: SecurityGroup
id: aws-security-group
title: AWS security group
description: Security group with explicit ingress and egress rules. Policy blocks 0.0.0.0/0 ingress.
source: terraform-aws-modules/security-group/aws
versions:
  - 6.0.0
providers:
  - hashicorp/aws
inputs:
  - name: name
    type: string
    required: true
    description: Security group name.
    pattern: ^[a-z0-9-]{1,64}$
  - name: description
    type: string
    description: Security group description.
    pattern: ^[A-Za-z0-9 ._:/()#,@\[\]+=&;{}!$*-]{0,255}$
  - name: vpc_id
    type: string
    required: true
    description: VPC ID, usually a reference to an aws-vpc module output.
    pattern: ^vpc-[0-9a-f]{8,17}$
  - name: ingress_rules
    type: json
    description: Map of ingress rules (cidr_ipv4, from_port, to_port, ip_protocol, description).
  - name: egress_rules
    type: json
    description: Map of egress rules.
  - name: tags
    type: map(string)
    description: Tags for the security group.
outputs:
  - id
  - arn
  - name
# Adopting an existing security group manages the group itself, with its
# exact name, in the VPC it belongs to (a reference to the VPC's stack when
# SrustiOps manages it). Rules that already exist stay as they are in AWS:
# importing them would tag them, which the zero-diff gate forbids; rules
# added to the contract later are managed.
adopt:
  resource: aws_security_group
  match:
    aws: ["ec2:security-group"]
  properties:
    aws: {type: "AWS::EC2::SecurityGroup", id: "{{id_tail}}"}
  inputs:
    name: "{{prop:GroupName}}"
    description: "{{prop:GroupDescription}}"
    vpc_id: "{{prop:VpcId}}"
    tags: "{{tags}}"
  gaps:
    use_name_prefix: false
  dependencies:
    - {path: VpcId, kind: VPC, output: vpc_id, input: vpc_id}
  imports:
    - {to: "aws_security_group.this[0]", id: "{{id_tail}}"}
